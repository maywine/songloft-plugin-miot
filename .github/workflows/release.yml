name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则自动生成日期版本，格式：Y.M.D）'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - '.github/release-request'
  schedule:
    # 每天北京时间 08:17（UTC 00:17）。此刻 UTC 日期与北京日期一致，版本号不会错位。
    # 仅当「自上次发版以来有新提交」时才真正发版，见 gate job。
    - cron: '17 0 * * *'

# cron 与手动触发若撞在一起，两个 job 都会 git push bump 提交，后者必然 rejected
concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # 必须：默认 depth=1 且不拉 tag，git describe 会失败

      - name: Check for new commits since last release
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "非定时触发，跳过门禁直接发版"
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$LAST_TAG" ]; then
            echo "仓库尚无 tag，视为首次发版"
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 排除本 workflow 自己产生的 bump 提交，只数真实改动
          COUNT="$(git log --oneline --invert-grep \
                     --grep='^chore(release): bump to v' \
                     "${LAST_TAG}..HEAD" | wc -l)"
          echo "自 ${LAST_TAG} 以来的提交："
          git log --oneline "${LAST_TAG}..HEAD"
          echo "其中非发版提交数：${COUNT}"

          if [ "$COUNT" -gt 0 ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "✅ 有 ${COUNT} 个新提交，继续发版" >> $GITHUB_STEP_SUMMARY
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "⏭️ 自 ${LAST_TAG} 以来无新提交，跳过今日发版" >> $GITHUB_STEP_SUMMARY
          fi

  release:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="$(tr -d '[:space:]' < .github/release-request)"
          elif [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="$(TZ='Asia/Shanghai' date +'%Y.%-m.%-d')"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Ensure release version is unused
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release/tag ${TAG} already exists; refusing to overwrite" >&2
            exit 1
          fi

      - name: Update immutable release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const manifest = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
          manifest.version = version;
          manifest.download_url = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}/${manifest.entryPath}.jsplugin.zip`;
          // ZIP 原始哈希只能在构建完成后计算；先清掉上一个版本的固定值，
          // 避免把旧哈希打进新 ZIP 的内部清单。
          delete manifest.downloadSha256;
          fs.writeFileSync('plugin.json', JSON.stringify(manifest, null, 2) + '\n');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = version;
          if (lock.packages && lock.packages['']) lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE

      - name: Inject Tracely config and plugin version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s|appId: ''|appId: '$TRACELY_APP_ID'|" static/js/app.js
          sed -i "s|appSecret: ''|appSecret: '$TRACELY_APP_SECRET'|" static/js/app.js
          sed -i "s|host: ''|host: '$TRACELY_HOST'|" static/js/app.js
          sed -i "s|const PLUGIN_VERSION = '.*'|const PLUGIN_VERSION = '${VERSION}'|" static/js/app.js
        env:
          TRACELY_APP_ID: ${{ secrets.TRACELY_APP_ID }}
          TRACELY_APP_SECRET: ${{ secrets.TRACELY_APP_SECRET }}
          TRACELY_HOST: ${{ secrets.TRACELY_HOST }}

      - name: Build
        run: npm run build

      - name: Finalize and verify release hashes
        id: plugin_info
        run: |
          ENTRY_PATH=$(node -p "require('./plugin.json').entryPath")
          ZIP_NAME="${ENTRY_PATH}.jsplugin.zip"
          unzip -p "dist/${ZIP_NAME}" plugin.json > /tmp/built-plugin.json
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const root = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
          const built = JSON.parse(fs.readFileSync('/tmp/built-plugin.json', 'utf8'));
          for (const field of ['version', 'download_url']) {
            if (root[field] !== built[field]) throw new Error(`${field} mismatch: root=${root[field]} zip=${built[field]}`);
          }
          root.entryHash = built.entryHash;
          root.zipHash = built.zipHash;
          root.downloadSha256 = crypto.createHash('sha256')
            .update(fs.readFileSync(`dist/${root.entryPath}.jsplugin.zip`))
            .digest('hex');
          fs.writeFileSync('plugin.json', JSON.stringify(root, null, 2) + '\n');
          NODE
          sha256sum "dist/${ZIP_NAME}" > "dist/${ZIP_NAME}.sha256"
          npm run validate
          echo "entryPath=${ENTRY_PATH}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Commit finalized manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.json package.json package-lock.json
          git diff --staged --quiet || git commit -s -m "chore(release): bump to v${VERSION}"
          git push

      - name: Create immutable GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${{ steps.plugin_info.outputs.zip_name }}"
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release/tag ${TAG} already exists; refusing to overwrite" >&2
            exit 1
          fi
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
          gh release create "${TAG}" \
            "dist/${ZIP_NAME}" \
            "dist/${ZIP_NAME}.sha256" \
            --verify-tag \
            --title "${TAG}" \
            --notes "自动构建的 JS 插件 ${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Attest release artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/${{ steps.plugin_info.outputs.zip_name }}
